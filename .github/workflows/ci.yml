# Pull requests run the short check; dev runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@5f90c9245c2dc69ebc7d50d59c7a7bdd8a4c8d0d # v0.6.131
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      tool-assets: .github/ci-tools.json
