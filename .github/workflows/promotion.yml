# Moves main to the newest dev commit whose full check passed.
name: promotion

on:
  # The pinned promotion selects checked dev pushes and executes no triggering source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/promote.yml@453260abc91be392dc099bfa774baecde05e8152 # v0.6.129
    # The deploy key lives in the promotion environment, which only dev may use.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      actions: read
      contents: read
